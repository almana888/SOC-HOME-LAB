<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d32f2f"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
  </defs>
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#212121">Splunk Lab Topology</text>
  <rect x="20" y="55" width="860" height="445" rx="16" fill="#fafafa" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="38" y="85" font-size="15" font-weight="600" fill="#616161">LAN 192.168.1.0/24</text>

  <!-- Kali -->
  <rect x="60" y="120" width="240" height="110" rx="12" fill="#ffebee" stroke="#d32f2f" stroke-width="2.5"/>
  <text x="180" y="156" text-anchor="middle" font-size="19" font-weight="700" fill="#b71c1c">Kali Linux</text>
  <text x="180" y="180" text-anchor="middle" font-size="14" fill="#424242">Attacker</text>
  <text x="180" y="208" text-anchor="middle" font-size="16" font-weight="600" fill="#212121">192.168.1.104</text>

  <!-- Windows -->
  <rect x="600" y="120" width="240" height="110" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <text x="720" y="152" text-anchor="middle" font-size="19" font-weight="700" fill="#0d47a1">Windows 10</text>
  <text x="720" y="173" text-anchor="middle" font-size="13" fill="#424242">Victim · Splunk Universal Forwarder</text>
  <text x="720" y="208" text-anchor="middle" font-size="16" font-weight="600" fill="#212121">192.168.1.107</text>

  <!-- Splunk -->
  <rect x="295" y="350" width="310" height="115" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="450" y="382" text-anchor="middle" font-size="19" font-weight="700" fill="#1b5e20">Ubuntu · Splunk Enterprise</text>
  <text x="450" y="405" text-anchor="middle" font-size="14" fill="#424242">SIEM · Receiver 9997 · Web 8000</text>
  <text x="450" y="440" text-anchor="middle" font-size="16" font-weight="600" fill="#212121">192.168.1.102</text>

  <!-- Attack -->
  <line x1="304" y1="175" x2="594" y2="175" stroke="#d32f2f" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#red)"/>
  <text x="450" y="162" text-anchor="middle" font-size="14" font-weight="600" fill="#d32f2f">Attack traffic</text>

  <!-- Logs -->
  <line x1="700" y1="234" x2="560" y2="344" stroke="#1565c0" stroke-width="3" marker-end="url(#blue)"/>
  <text x="652" y="300" font-size="14" font-weight="600" fill="#1565c0">Logs → TCP 9997</text>

  <!-- Legend -->
  <line x1="60" y1="484" x2="100" y2="484" stroke="#d32f2f" stroke-width="3" stroke-dasharray="9 6"/>
  <text x="108" y="489" font-size="13" fill="#424242">Attack</text>
  <line x1="170" y1="484" x2="210" y2="484" stroke="#1565c0" stroke-width="3"/>
  <text x="218" y="489" font-size="13" fill="#424242">Log forwarding</text>
